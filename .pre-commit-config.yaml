minimum_pre_commit_version: "4.6.1"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
      - id: check-toml
        name: check TOML
        entry: uv run --locked check-toml
        language: system
        types: [toml]
      - id: check-yaml
        name: check YAML
        entry: uv run --locked check-yaml
        language: system
        types: [yaml]
      - id: check-merge-conflict
        name: check merge conflicts
        entry: uv run --locked check-merge-conflict
        language: system
        types: [text]
      - id: detect-private-key
        name: detect private keys
        entry: uv run --locked detect-private-key
        language: system
        types: [text]
